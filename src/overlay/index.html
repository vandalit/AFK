<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AFK - Vectorial Affordance Layer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      pointer-events: none; /* Click-through a nivel CSS */
    }

    svg#affordance-canvas {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      overflow: visible;
    }

    /* ── L1/L2/L3: Puntero del índice ─────────────────────────── */
    .index-pointer {
      fill: #00ffcc;
      stroke: rgba(255, 255, 255, 0.92);
      stroke-width: 2px;
      filter: drop-shadow(0 0 7px rgba(0, 255, 204, 0.85))
              drop-shadow(0 0 2px rgba(0, 255, 204, 0.50));
      transition: fill 0.12s ease-out,
                  filter 0.12s ease-out,
                  r 0.08s ease-out;
    }

    /* Estado PUSH_ARMED: puntero cambia a rojo urgente */
    .index-pointer.push-armed {
      fill: #ff2d55;
      stroke: rgba(255, 200, 210, 0.95);
      stroke-width: 2.5px;
      filter: drop-shadow(0 0 12px rgba(255, 45, 85, 1.0))
              drop-shadow(0 0 4px rgba(255, 100, 120, 0.80));
      r: 14; /* radio mayor como señal visual de armado */
    }

    /* Estado DRAG: puntero cambia a ámbar neón de arrastre */
    .index-pointer.dragging {
      fill: #ffb703;
      stroke: #ffffff;
      stroke-width: 2.5px;
      filter: drop-shadow(0 0 12px rgba(255, 183, 3, 1.0))
              drop-shadow(0 0 4px rgba(255, 214, 10, 0.85));
      r: 13;
    }

    /* ── L2: Esqueleto articular ───────────────────────────────── */
    .bone-line {
      stroke: rgba(0, 255, 204, 0.40);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .joint-node {
      fill: rgba(255, 255, 255, 0.72);
      stroke: rgba(0, 255, 204, 0.30);
      stroke-width: 1px;
    }

    /* ── L3: Grupos de volumen (cápsulas de falanges) ─────────── */
    /* Los estilos inline de fill/stroke/opacity se aplican desde JS.
       Este grupo recibe el atributo filter="url(#handGlow)" en runtime. */
    #volume-group {
      will-change: transform; /* hint de compositing para el GPU */
    }
  </style>
</head>
<body>
  <svg id="affordance-canvas">
    <!--
      Orden de capas (de fondo a frente):
      1. volume-group  → cápsulas volumétricas L3 (detrás)
      2. skeleton-group → esqueleto articular L2
      3. index-dot     → puntero del índice L1/L2/L3 (siempre al frente)
    -->
    <g id="volume-group"></g>
    <g id="skeleton-group"></g>

    <!-- Puntero principal: yema del dedo índice (Landmark 8) -->
    <circle id="index-dot" class="index-pointer" cx="-200" cy="-200" r="10" />
  </svg>

  <script type="module" src="./hand-renderer.ts"></script>
</body>
</html>
